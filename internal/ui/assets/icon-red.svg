<svg xmlns="http://www.w3.org/2000/svg" viewBox="33 70 174 118" width="512" height="347">
  <!-- 信封：浅蓝灰底 + 蓝灰轮廓 + 白色 V 线 + 放大红点（未读位，数字由应用绘制）
       不使用 clipPath；V 线为预计算实心路径，端头沿圆角弧线（r=12）收尾 -->
  <g id="envelope" shape-rendering="geometricPrecision">
    <!-- 信封主体：极浅蓝灰填充 -->
    <rect id="body-fill"
          x="41.6" y="78.6" width="156.8" height="100.8" rx="11.4"
          fill="#E4EDF5"/>
    <!-- V 形折线：深色底层（宽 10）+ 白色上层（宽 7），描边 1.5px -->
    <g id="flaps">
      <path id="flap-left-outline"
            d="M41.788 85.717
               A12 12 0 0 1 49.076 78.660
               L129.651 137.890
               L122.363 144.947
               Z"
            fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
      <path id="flap-left"
            d="M42.430 84.327
               A12 12 0 0 1 47.479 79.349
               L128.054 138.579
               L123.005 143.557
               Z"
            fill="#FFFFFF"/>
      <path id="flap-right-outline"
            d="M198.212 85.717
               A12 12 0 0 0 190.924 78.660
               L110.349 137.890
               L117.637 144.947
               Z"
            fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
      <path id="flap-right"
            d="M197.570 84.327
               A12 12 0 0 0 192.521 79.349
               L111.946 138.579
               L116.995 143.557
               Z"
            fill="#FFFFFF"/>
    </g>
    <!-- 外轮廓线 -->
    <rect id="body-outline"
          x="38" y="75" width="164" height="108" rx="14"
          fill="none" stroke="#000000" stroke-width="6"/>
    <!-- 有未读：红色封蜡圆点，半径与 icon.svg 的灰点一致 -->
    <circle id="seal"
            cx="120" cy="137" r="26"
            fill="#D24B3E" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
